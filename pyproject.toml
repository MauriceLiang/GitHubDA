[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "repovantage"
version = "0.1.0"
description = "RepoVantage backend for GitHub repository analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.2,<2",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "respx>=0.21,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-q"
