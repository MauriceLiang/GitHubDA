<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoVantage · 开源项目数据分析</title>
    <link rel="icon" type="image/png" href="/repovantage-favicon.png?v=20261022" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 主题需在首帧前确定，避免闪烁
      const saved = (localStorage.getItem('repovantage-theme') ?? localStorage.getItem('githubda-theme'))
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
