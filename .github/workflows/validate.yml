name: GitHubDA validation

on:
  pull_request:
  push:
    branches:
      - main
      - integration/githubda-validation
      - fix/githubda-backend

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,frontend]'
      - name: Compile Python source
        run: python -m compileall -q backend frontend migrations scripts tests
      - name: Run backend tests
        run: python -m pytest tests/backend -q
      - name: Run frontend tests when present
        if: ${{ hashFiles('tests/frontend/**/*.py') != '' }}
        run: python -m pytest tests/frontend -q
      - name: Report missing frontend test suite
        if: ${{ hashFiles('tests/frontend/**/*.py') == '' }}
        run: echo "::notice::tests/frontend is not present; frontend DTO integration remains a separate validation item."
